<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online Store Demo · Nobo Ishraque</title>
<meta name="description" content="A sample online store with a cart, checkout, payment step, order tracking and an owner dashboard. Built by Nobo Ishraque.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f1a1e; --muted:#6d6369; --paper:#fffafa; --card:#fff; --line:#ece5e9; --field:#d9d0d5;
  --accent:#b0245a; --accent-ink:#fff; --accent-soft:#fbe4ed; --tile:#fde6ee; --tile2:#fff0d6;
  --bar:#17141a; --ok:#16794a; --warn:#a85400; --bad:#b42318;
  --f-display:"Baloo Da 2","Hind Siliguri",system-ui,sans-serif;
  --f-body:"Hind Siliguri","Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;height:auto;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(30px,5vw,48px)}
h2{font-size:clamp(24px,3.4vw,32px)}
h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.hide{display:none!important}
.ic{width:22px;height:22px;flex:none}

/* demo bar */
.demobar{background:var(--bar);color:#f3eef1;font-size:14px}
.demobar .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;padding-top:8px;padding-bottom:8px}
.db-text{display:flex;align-items:center;gap:8px;min-width:0;font-weight:500}
.db-pill{flex:none;background:#fff;color:var(--bar);font-weight:700;font-size:11px;letter-spacing:.08em;padding:2px 9px;border-radius:99px}
.db-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:#ffffff1f;border-radius:99px;padding:3px}
.seg button{border:0;background:transparent;color:#f3eef1;opacity:.8;padding:4px 12px;border-radius:99px;cursor:pointer;font-size:14px;font-weight:600}
.seg button[aria-pressed="true"]{background:#fff;color:var(--bar);opacity:1}
.db-dash{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;padding:5px 13px;border-radius:99px}
.db-note{background:#26212b;color:#ddd5da;font-size:13px}
.db-note .wrap{padding-top:5px;padding-bottom:6px}

/* store header */
.top{position:sticky;top:0;z-index:20;background:var(--paper);background:color-mix(in srgb,var(--paper) 90%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0;margin-right:auto}
.logo{flex:none;width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:16px}
.bname{font-family:var(--f-display);font-weight:700;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mainnav{display:flex;gap:2px}
.mainnav a{text-decoration:none;padding:7px 12px;border-radius:99px;font-weight:500;color:var(--muted);white-space:nowrap}
.mainnav a:hover{color:var(--ink)}
.mainnav a[aria-current="page"]{color:var(--ink);background:var(--accent-soft)}
.cartbtn{position:relative;flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:99px;background:var(--card);border:1px solid var(--line);text-decoration:none}
.badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;display:grid;place-items:center;line-height:1}
@media(max-width:780px){
  .top-in{flex-wrap:wrap;gap:6px 12px;padding-top:10px}
  .mainnav{order:3;width:calc(100% + 32px);margin:0 -16px;padding:0 12px 8px;overflow-x:auto;scrollbar-width:none}
  .mainnav::-webkit-scrollbar{display:none}
  .mainnav a{padding:6px 12px;font-size:15px}
}
.closed{background:#fff4e5;color:#7a3e00;font-size:14px;text-align:center;padding:8px 16px;font-weight:500}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:99px;border:0;font-weight:600;cursor:pointer;text-decoration:none;font-size:16px;line-height:1.2;text-align:center;transition:transform .15s ease,filter .2s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.dark{background:var(--ink);color:#fff}
.btn.wa{background:#1b8f4b;color:#fff}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px;padding:0}
.more{color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap}

/* home */
.hero{padding:36px 0 12px}
.hero-in{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center}
.eyebrow{color:var(--accent);font-weight:600}
.hero h1{margin-top:6px}
.lead{color:var(--muted);font-size:18px;margin:14px 0 22px;max-width:32em}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px}
.hero-pic{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:4/3;background:var(--tile)}
.hero-pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-float{position:absolute;left:14px;bottom:14px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:9px 13px;box-shadow:0 10px 30px rgba(0,0,0,.16);font-size:14px;font-weight:600}
.hero-float i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
@media(max-width:780px){.hero{padding:16px 0 4px}.hero-in{grid-template-columns:1fr;gap:18px}.hero-pic{order:-1;border-radius:22px}.lead{font-size:17px;margin:10px 0 18px}}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:26px}
.trust div{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-weight:500;font-size:15px;line-height:1.3}
.trust svg{color:var(--accent)}
@media(max-width:780px){.trust{grid-template-columns:1fr 1fr;gap:10px}.trust div{font-size:14px;padding:10px 12px}}
.sec{padding:34px 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.cattiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.cattile{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:4/3;text-decoration:none;color:#fff;background:var(--tile)}
.cattile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.cattile:hover img{transform:scale(1.04)}
.cattile span{position:absolute;inset:auto 0 0 0;padding:30px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.7));font-weight:600;font-size:17px;line-height:1.25}
.cattile small{display:block;font-weight:400;opacity:.9;font-size:13px}
@media(max-width:520px){.cattiles{grid-template-columns:1fr 1fr;gap:10px}.cattile span{font-size:15px}}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;counter-reset:s;list-style:none;padding:0;margin:0}
.steps3 li{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;counter-increment:s;font-weight:500}
.steps3 li::before{content:counter(s);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;margin-bottom:8px}
@media(max-width:620px){.steps3{grid-template-columns:1fr}}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.box h3{font-size:17px;margin-bottom:6px}
.box p{color:var(--muted);font-size:15px}
@media(max-width:780px){.boxes{grid-template-columns:1fr}}

/* product cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:12px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.pic{position:relative;display:block;aspect-ratio:4/3;background:var(--tile);overflow:hidden}
.pic .emo{position:absolute;inset:0;display:grid;place-items:center;font-size:44px}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:10px;left:10px;background:#fff;color:var(--ink);font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.tag.out{background:var(--ink);color:#fff}
.tag.low{background:#fff4e5;color:var(--warn)}
.cbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px;flex:1}
.cname{font-weight:600;font-size:16px;line-height:1.3;text-decoration:none}
.cname:hover{color:var(--accent)}
.cunit{color:var(--muted);font-size:13px}
.cprice{font-weight:700;font-size:18px;margin:6px 0 10px}
.cbody .btn{margin-top:auto}
@media(max-width:520px){.cbody{padding:10px}.cname{font-size:15px}.cprice{font-size:16px}.cbody .btn{min-height:40px;font-size:14px;padding:0 8px}}

/* shop page */
.pagehead{padding:26px 0 6px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 20px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1 1 100%}
.chips::-webkit-scrollbar{display:none}
.chips a{white-space:nowrap;text-decoration:none;padding:7px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:500;font-size:15px}
.chips a[aria-current="page"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--field);background:#fff;border-radius:99px;padding:10px 16px;font-size:16px}
.sortsel{border:1px solid var(--field);background:#fff;border-radius:99px;padding:10px 14px}
.empty{text-align:center;padding:56px 16px;color:var(--muted)}
.empty .btn{margin-top:16px}

/* product page */
.crumbs{font-size:14px;color:var(--muted);padding-top:18px}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--accent)}
.pp{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;padding:16px 0 10px;align-items:start}
.pp .pic{border-radius:24px}
.pp h1{font-size:clamp(28px,4vw,40px)}
.pp .unit{color:var(--muted);margin-top:4px}
.pprice{font-size:30px;font-weight:700;margin:12px 0 2px;font-family:var(--f-display)}
.stock{font-size:14px;font-weight:600}
.stock.ok{color:var(--ok)}.stock.low{color:var(--warn)}.stock.out{color:var(--bad)}
.pdesc{margin-top:12px;font-size:17px}
.optlbl{font-weight:600;margin:18px 0 8px;display:block}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--field);background:var(--card);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:600;min-width:52px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.qrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:20px 0 6px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--field);border-radius:99px;background:var(--card)}
.stepper button{width:42px;height:42px;border:0;background:none;font-size:20px;cursor:pointer;border-radius:99px}
.stepper span{min-width:26px;text-align:center;font-weight:700}
.qrow .btn{flex:1;min-width:180px}
.info{display:grid;gap:10px;margin-top:22px}
.info details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.info summary{font-weight:600;cursor:pointer}
.info details p{color:var(--muted);margin-top:6px;font-size:15px}
@media(max-width:780px){.pp{grid-template-columns:1fr;gap:16px}.pp .pic{border-radius:20px}}

/* forms */
.field{display:grid;gap:6px;margin-bottom:14px}
.field label,.flabel{font-weight:600;font-size:15px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--field);background:#fff;border-radius:12px;padding:11px 14px;font-size:16px}
.field textarea{min-height:96px;resize:vertical}
.hint{font-size:13px;color:var(--muted)}
.err{font-size:13px;color:var(--bad);font-weight:600}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--bad)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.panel+.panel{margin-top:16px}
.panel h2{font-size:21px;margin-bottom:14px}
.pays{display:grid;gap:10px}
.payopt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;background:#fff;line-height:1.35}
.payopt input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
.payopt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.payopt b{display:block}
.payopt small{color:var(--muted)}

/* cart + checkout */
.split{display:grid;grid-template-columns:1fr 380px;gap:24px;align-items:start;padding:20px 0 40px}
.split.c2{grid-template-columns:1fr 340px}
.split aside{position:sticky;top:84px}
@media(max-width:900px){.split,.split.c2{grid-template-columns:1fr}.split aside{position:static}}
.lines{display:grid;gap:12px}
.line{display:grid;grid-template-columns:88px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px}
.line .pic{border-radius:12px;width:88px}
.lname{font-weight:600;text-decoration:none;line-height:1.3}
.lmeta{font-size:13px;color:var(--muted)}
.lright{display:grid;gap:6px;justify-items:end}
.lright b{font-size:17px}
@media(max-width:560px){.line{grid-template-columns:64px 1fr}.line .pic{width:64px}.lright{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}}
.sum{display:grid;gap:8px;font-size:15px}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum .tot{font-size:19px;font-weight:700;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.sum .neg{color:var(--ok)}
.free{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.free i{display:block;height:6px;background:#fff;border-radius:9px;margin-top:8px;overflow:hidden}
.free i b{display:block;height:100%;background:var(--accent);border-radius:9px}
.coupon{display:flex;gap:8px;margin:14px 0 4px}
.coupon input{flex:1;min-width:0;border:1px solid var(--field);border-radius:12px;padding:9px 12px;text-transform:uppercase}
.mini-lines{display:grid;gap:8px;margin-bottom:14px;font-size:14px}
.mini-lines div{display:flex;justify-content:space-between;gap:10px}
.mini-lines span{color:var(--muted)}

/* pay + order */
.paybox{max-width:560px;margin:30px auto 50px}
.paybox .amt{font-family:var(--f-display);font-size:40px;font-weight:700;margin:6px 0}
.demo-step{border:2px dashed #d7cdd3;border-radius:16px;padding:16px;margin:16px 0;background:#fbf8fa;font-size:15px}
.demo-step b{display:block;margin-bottom:4px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.failbox{background:#fde8e8;color:#7a1712;border-radius:14px;padding:12px 14px;font-weight:600;margin:12px 0}
.done-hero{text-align:center;padding:34px 0 6px}
.checkmark{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 14px}
.checkmark svg{width:34px;height:34px}
.done-hero p{color:var(--muted);margin-top:8px;font-size:17px}
.ogrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px 0 40px}
@media(max-width:780px){.ogrid{grid-template-columns:1fr}}
.tl{list-style:none;padding:0;margin:0}
.tl li{position:relative;padding:0 0 18px 32px;line-height:1.35}
.tl li::before{content:"";position:absolute;left:4px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #cdc3c9;z-index:1}
.tl li::after{content:"";position:absolute;left:11px;top:19px;bottom:-1px;width:2px;background:#e5dde2}
.tl li:last-child{padding-bottom:0}
.tl li:last-child::after{display:none}
.tl li.on::before{background:var(--ok);border-color:var(--ok)}
.tl li.on::after{background:var(--ok)}
.tl li.now::before{box-shadow:0 0 0 5px rgba(22,121,74,.2)}
.tl li.x::before{background:var(--bad);border-color:var(--bad)}
.tl b{display:block;font-weight:600}
.tl small{color:var(--muted)}
.note{background:#f4f1f3;border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted)}
.kv{display:grid;gap:4px;font-size:15px}
.kv span{color:var(--muted)}
.ul-clean{margin:8px 0 0;padding-left:20px;display:grid;gap:4px}

/* status pills */
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:#eee;white-space:nowrap;line-height:1.6}
.pill.placed{background:#e7f0ff;color:#1f4fb3}.pill.unpaid{background:#fff4e5;color:var(--warn)}.pill.confirmed{background:#efe7ff;color:#5b34b5}
.pill.packed{background:#fff7d6;color:#755700}.pill.shipped{background:#e3f4ff;color:#075985}.pill.delivered{background:#e5f6ec;color:var(--ok)}
.pill.cancelled{background:#fde8e8;color:var(--bad)}.pill.sample{background:#f1eef0;color:var(--muted);font-weight:600}

/* admin */
.admin{background:#f4f3f5;padding-bottom:30px}
.admin-head{padding:22px 0 4px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:flex-end;justify-content:space-between}
.admin-note{font-size:14px;color:var(--muted);max-width:44em}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{white-space:nowrap;text-decoration:none;padding:8px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:15px}
.tabs a[aria-current="page"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs .cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;margin-left:6px;border-radius:99px;background:var(--accent);color:#fff;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0 14px}
.kpi{background:#fff;border-radius:18px;padding:14px 16px;border:1px solid var(--line)}
.kpi small{color:var(--muted);font-weight:500;font-size:14px}
.kpi b{display:block;font-size:28px;font-family:var(--f-display);line-height:1.2;margin-top:2px}
@media(max-width:780px){.kpis{grid-template-columns:1fr 1fr}}
.cards2{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}
@media(max-width:900px){.cards2{grid-template-columns:1fr}}
.acard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.acard h3{font-size:17px;margin-bottom:10px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:190px}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%;min-width:0}
.bars i{display:block;width:100%;max-width:46px;background:var(--accent);border-radius:8px 8px 4px 4px;min-height:4px}
.bars div.today i{background:var(--ink)}
.bars span{font-size:12px;color:var(--muted);white-space:nowrap}
.bars em{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap}
.alist{display:grid;gap:8px}
.arow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px}
.arow small{color:var(--muted);display:block;font-size:13px}
.olist{display:grid;gap:10px}
.orow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.orow .oid{font-weight:700}
.ometa{font-size:13px;color:var(--muted)}
.orow select,.ssel{border:1px solid var(--field);border-radius:10px;padding:7px 10px;background:#fff;font-size:15px}
.o-tot{font-weight:700;text-align:right}
@media(max-width:620px){.orow{grid-template-columns:1fr auto}.o-act{grid-column:1/-1;display:flex;gap:8px}.o-act select{flex:1}}
.o-act{display:flex;gap:8px;align-items:center}
.prow{display:grid;grid-template-columns:56px minmax(0,1fr) 110px 90px auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.prow .pic{width:56px;border-radius:10px}
.prow input[type=number]{width:100%;border:1px solid var(--field);border-radius:10px;padding:7px 9px}
.prow label{display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}
.prow .plabel{display:none;font-size:12px;color:var(--muted)}
@media(max-width:620px){.prow{grid-template-columns:56px 1fr 1fr}.prow .pn{grid-column:2/-1}.prow .plabel{display:block}.prow .pf{grid-column:auto}.prow .pshow{grid-column:1/-1}}
.chk{display:flex;align-items:center;gap:10px;font-weight:500;padding:6px 0}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.msg{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.msg p{margin:6px 0 10px}
.msg.done{opacity:.6}
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,16,22,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:min(660px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 20px 26px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.xbtn{border:0;background:#f1eef0;width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer;flex:none}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:24px}}
.itab{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0}
.itab td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.itab td:last-child{text-align:right;white-space:nowrap}

/* footer */
.foot{background:#fff;border-top:1px solid var(--line);margin-top:20px;padding:34px 0 26px;font-size:15px}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:24px}
@media(max-width:780px){.fgrid{grid-template-columns:1fr 1fr}.fgrid>div:first-child{grid-column:1/-1}}
.foot h3{font-size:16px;margin-bottom:8px}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.foot a{color:var(--muted);text-decoration:none}
.foot a:hover{color:var(--accent)}
.paychips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.paychips span{border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:13px;font-weight:600}
.credit{margin-top:28px;background:var(--bar);color:#f3eef1;border-radius:22px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.credit b{font-size:17px}
.credit p{margin-top:6px;color:#d8d0d5;font-size:15px;max-width:52em}
.credit-actions{display:flex;flex-wrap:wrap;gap:8px}
.credit .btn.ghost{background:transparent;color:#fff;border-color:#ffffff40}
@media(max-width:780px){.credit{grid-template-columns:1fr}}
.credits{margin-top:16px;font-size:13px;color:var(--muted)}
.credits summary{cursor:pointer;font-weight:600}
.credits ul{padding-left:18px}
.credits a{color:var(--muted)}
.toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:grid;gap:8px;width:min(92vw,440px);pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:11px 16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.22);animation:tin .25s ease;pointer-events:auto}
.toast a{color:#fff;font-weight:700;margin-left:8px}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block!important;font-family:var(--f-body);color:#000;padding:10px}}
.inv h1{font-size:26px}.inv table{width:100%;border-collapse:collapse;margin:14px 0}.inv td,.inv th{border-bottom:1px solid #ccc;padding:6px 4px;text-align:left}.inv td:last-child,.inv th:last-child{text-align:right}
</style>

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(n){var s=Number(n).toLocaleString('en-IN');return S.lang==='bn'?s.replace(/\d/g,function(d){return BN[d]}):s}

function toLatin(s){return String(s).replace(/[০-৯]/g,function(d){return BN.indexOf(d)})}

function dtL(ts){var d=new Date(ts),t=new Date();var same=ymd(d)===ymd(t);try{return (same?'':d.toLocaleDateString(loc(),{day:'numeric',month:'short'})+', ')+timeL(ts)}catch(e){return ''}}
function normPhone(s){var d=toLatin(s||'').replace(/\D/g,'');if(/^8801\d{9}$/.test(d))d=d.slice(2);return /^01[3-9]\d{8}$/.test(d)?d:null}
function mask(p){return p?p.slice(0,3)+'•••'+p.slice(-3):''}
function initials(n){var w=String(n).replace(/[^A-Za-z0-9ঀ-৿ ]/g,' ').trim().split(/\s+/);return ((w[0]||'S').charAt(0)+(w[1]?w[1].charAt(0):'')).toUpperCase()}

/* ---------- storage ---------- */
function slug(s){return String(s||'').toLowerCase().replace(/[^a-z0-9ঀ-৿]+/g,'-').replace(/^-|-$/g,'').slice(0,40)}
function saveDB(){try{localStorage.setItem(S.key,JSON.stringify(S.db))}catch(e){}}
function stockFor(i,n){if(i===n-1)return 0;if(i===2)return 3;return [18,24,12,30,15,20,9,14,11][i%9]}
function freshDB(){
  var d={v:1,products:{},orders:[],msgs:[],cart:[],coupon:'',last:null,nextId:1043,seeded:ymd(new Date()),
    settings:{feeIn:FEE_IN,feeOut:FEE_OUT,freeOver:FREE_OVER,cod:true,bkash:true,nagad:true,card:true,open:true}};
  var items=K().items;
  items.forEach(function(it,i){d.products[it.id]={p:it.p,stock:stockFor(i,items.length),hidden:false}});
  d.orders=seedOrders();
  d.msgs=[{id:1,sample:true,at:Date.now()-5*3600e3,name:{en:'Sadia Rahman',bn:'সাদিয়া রহমান'},phone:'01700000005',
    text:{en:'Do you take bulk orders for an office event next week?',bn:'আগামী সপ্তাহে অফিসের অনুষ্ঠানের জন্য বেশি পরিমাণে অর্ডার নেন?'},done:false}];
  return d;
}
function seedOrders(){
  var items=K().items, now=Date.now(), seed=11+S.kind.length*17, out=[];
  function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
  var plan=[[6,11.2],[5,15.5],[4,13.1],[3,19.4],[2,12.3],[1,17.2],[1,20.1],[0,0.6],[0,0.35],[0,0.15]];
  var sts=['delivered','delivered','delivered','cancelled','delivered','delivered','shipped','confirmed','placed','placed'];
  var pays=['cod','bkash','cod','cod','nagad','card','bkash','cod','bkash','cod'];
  var inDhaka=AREAS.filter(function(a){return !a.out});
  plan.forEach(function(pl,i){
    var at;
    if(pl[0]===0){at=now-pl[1]*3600e3}
    else{var d=new Date(now);d.setDate(d.getDate()-pl[0]);d.setHours(Math.floor(pl[1]),Math.round((pl[1]%1)*60),0,0);at=d.getTime()}
    var lines=[],n=1+Math.floor(rnd()*2);
    for(var j=0;j<n;j++){var it=items[Math.floor(rnd()*(items.length-1))];if(lines.some(function(l){return l.id===it.id}))continue;lines.push({id:it.id,opt:'',q:1+Math.floor(rnd()*2),p:it.p})}
    var a=(K().outside&&i===5)?area('outside'):inDhaka[Math.floor(rnd()*inDhaka.length)];
    var sub=lines.reduce(function(s,l){return s+l.p*l.q},0);
    var fee=a.out?FEE_OUT:(sub>=FREE_OVER?0:FEE_IN);
    var st=sts[i],hist={placed:at},steps={confirmed:.4,packed:3,shipped:5,delivered:22};
    if(st==='cancelled'){hist.cancelled=at+.7*3600e3}
    else{STEPS.slice(1,STEPS.indexOf(st)+1).forEach(function(s,k){hist[s]=Math.min(at+steps[s]*3600e3,now-(3-k)*60e3)})}
    var h=5+i*3,r=2+i;
    out.push({id:1031+i,sample:true,at:at,name:NAMES[i],phone:'017000000'+pad(i+1),area:a.id,
      addr:{en:'House '+h+', Road '+r+', '+a.en,bn:'বাসা '+bnDig(h)+', রোড '+bnDig(r)+', '+a.bn},
      date:ymd(new Date(at)),slot:'',note:'',pay:pays[i],paid:pays[i]!=='cod'&&st!=='cancelled',trx:pays[i]!=='cod'?'DEMO'+(48213+i*731):'',
      lines:lines,sub:sub,disc:0,fee:fee,total:sub+fee,status:st,hist:hist,courier:(st==='shipped'||st==='delivered')?'DC'+(560120+i*37):''});
  });
  return out;
}
function shiftSample(d){
  var today=ymd(new Date());if(d.seeded===today)return;
  var p=d.seeded.split('-'),then=new Date(+p[0],p[1]-1,+p[2]),t=new Date();t.setHours(0,0,0,0);
  var days=Math.round((t-then)/864e5);if(!(days>0)){d.seeded=today;return}
  var ms=days*864e5;
  d.orders.forEach(function(o){if(!o.sample)return;o.at+=ms;Object.keys(o.hist).forEach(function(k){o.hist[k]+=ms});o.date=ymd(new Date(o.at))});
  d.msgs.forEach(function(m){if(m.sample)m.at+=ms});
  d.seeded=today;
}
function loadDB(){
  var raw=null,d=null;try{raw=localStorage.getItem(S.key)}catch(e){}
  try{d=raw?JSON.parse(raw):null}catch(e){d=null}
  if(!d||d.v!==1)d=freshDB();
  K().items.forEach(function(it,i,a){if(!d.products[it.id])d.products[it.id]={p:it.p,stock:stockFor(i,a.length),hidden:false}});
  shiftSample(d);
  S.db=d;saveDB();
}

function P(id){
  var it=null;K().items.forEach(function(x){if(x.id===id)it=x});if(!it)return null;
  var o=S.db.products[id]||{};
  return {id:it.id,cat:it.cat,e:it.e,en:it.en,bn:it.bn,uen:it.uen,ubn:it.ubn,den:it.den,dbn:it.dbn,
    p:Math.max(0,Math.round(+o.p||0)),stock:Math.max(0,Math.round(+o.stock||0)),hidden:!!o.hidden};
}
function prods(all){return K().items.map(function(it){return P(it.id)}).filter(function(p){return all||!p.hidden})}
function img(p,extra){
  var ph=PHOTOS[S.kind+'/'+p.id];
  return '<span class="pic"><span class="emo" aria-hidden="true">'+p.e+'</span>'+
    (ph?'<img src="../shop/img/'+S.kind+'-'+p.id+'.jpg" alt="'+esc(iname(p))+'" loading="lazy" width="600" height="450" onerror="this.remove()">':'')+(extra||'')+'</span>';
}
function stockTag(p){
  var w=W();if(p.stock<=0)return '<span class="tag out">'+esc(w.out)+'</span>';
  if(p.stock<=3)return '<span class="tag low">'+esc(w.left(p.stock))+'</span>';return '';
}
function cartLines(){return S.db.cart.map(function(l){var p=P(l.id);return p&&!p.hidden?{l:l,p:p}:null}).filter(Boolean)}
function cartCount(){return cartLines().reduce(function(a,c){return a+c.l.q},0)}
function inCart(id){return S.db.cart.filter(function(l){return l.id===id}).reduce(function(a,l){return a+l.q},0)}
function addCart(id,opt,q){
  var p=P(id),w=W();if(!p||p.stock<=0)return false;
  var room=p.stock-inCart(id);if(room<=0){toast(w.maxStock(p.stock));return false}
  q=Math.min(q,room);
  var line=null;S.db.cart.forEach(function(l){if(l.id===id&&l.opt===(opt||''))line=l});
  if(line)line.q+=q;else S.db.cart.push({id:id,opt:opt||'',q:q});
  saveDB();renderTop();
  toast(w.added(iname(p)),'#/cart',w.viewCart);
  return true;
}
function optLabel(id,opt){
  if(!opt)return '';var o=(OPTS[S.kind]||{})[id];var w=W();
  if(!o)return opt;return o.t==='text'?'“'+opt+'”':(o.t==='age'?w.age:w.size)+': '+dig(opt);
}
function totals(areaId){
  var s=S.db.settings,lines=cartLines();
  var sub=lines.reduce(function(a,c){return a+c.p.p*c.l.q},0);

  S.plan=(q.plan||'').toLowerCase()==='business'?'business':'premium';

function setStatus(o,st){
  if(!o||o.status===st)return;
  var wasX=o.status==='cancelled',isX=st==='cancelled';

  if(wasX&&!isX)o.lines.forEach(function(l){if(S.db.products[l.id])S.db.products[l.id].stock=Math.max(0,S.db.products[l.id].stock-l.q)});
  var now=Date.now();
  if(!isX){var idx=STEPS.indexOf(st);STEPS.slice(0,idx+1).forEach(function(s){if(!o.hist[s])o.hist[s]=now});STEPS.slice(idx+1).forEach(function(s){delete o.hist[s]});delete o.hist.cancelled}
  else o.hist.cancelled=now;
  if(st==='delivered'&&o.pay==='cod')o.paid=true;
  if(st!=='delivered'&&o.pay==='cod')o.paid=false;

  m.innerHTML='<div class="modal" data-act="closemodal"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mh"><div class="sheet-head"><div><h2 id="mh" style="font-size:24px">'+esc(w.orderT(dig(o.id)))+'</h2><span class="ometa">'+esc(w.placedAt)+': '+esc(dtL(o.at))+'</span></div><button class="xbtn" type="button" data-act="closemodal" aria-label="'+esc(w.backShop)+'">×</button></div>'+
    '<div class="o-act" style="margin-bottom:14px">'+statusSel(o)+'</div>'+
    '<div class="kv"><span>'+esc(w.custT)+'</span><b>'+esc(L(o.name))+' · '+esc(o.phone)+'</b><span>'+esc(L(o.addr))+', '+esc(L(area(o.area)))+'</span><span>'+esc(dayLabel(o.date)+slotTxt(o))+'</span>'+(o.note?'<span>“'+esc(o.note)+'”</span>':'')+'</div>'+
    itemsTable(o)+
    '<div class="kv"><span>'+esc(w.payStatus)+'</span><b>'+esc(w.pm[o.pay])+' · '+esc(o.paid?w.paidL:o.pay==='cod'?w.codL:w.unpaidL)+(o.trx?' · '+esc(o.trx):'')+'</b>'+(o.courier?'<span>'+esc(w.courierL)+': '+esc(o.courier)+'</span>':'')+'</div>'+
    '<h3 style="margin:16px 0 10px;font-size:17px">'+esc(w.histT)+'</h3>'+timeline(o)+
    '<div class="btnrow" style="margin-top:18px"><a class="btn ghost sm" href="tel:'+esc(o.phone)+'">'+esc(w.call)+'</a><a class="btn wa sm" target="_blank" rel="noopener" href="'+wa(w.waCustText(o.id,shop(),w.st[o.status]))+'">'+esc(w.waCust)+'</a>'+
    (['confirmed','packed'].indexOf(o.status)>=0&&!o.courier?'<button class="btn dark sm" type="button" data-act="courier" data-id="'+o.id+'">'+esc(w.bookCourier)+'</button>':'')+
    '<button class="btn ghost sm" type="button" data-act="print" data-id="'+o.id+'">'+esc(w.invoice)+'</button></div></div></div>';
  document.body.style.overflow='hidden';
  var x=m.querySelector('.xbtn');if(x)x.focus();
}
function adProducts(){
  var w=W();
  return '<p class="admin-note" style="margin:6px 0 12px">'+esc(w.prodNote)+'</p><div class="olist">'+prods(true).map(function(p){
    return '<div class="prow">'+img(p)+'<div class="pn"><b>'+esc(iname(p))+'</b><div class="ometa">'+esc(iunit(p))+(p.stock<=0?' · <span style="color:var(--bad)">'+esc(w.out)+'</span>':p.stock<=3?' · <span style="color:var(--warn)">'+esc(w.left(p.stock))+'</span>':'')+'</div></div>'+
      '<label class="pf" style="display:block"><span class="plabel">'+esc(w.priceL)+'</span><input type="number" min="0" step="10" data-pp="'+p.id+'" value="'+p.p+'" aria-label="'+esc(w.priceL)+'"></label>'+
      '<label class="pf" style="display:block"><span class="plabel">'+esc(w.stockL)+'</span><input type="number" min="0" step="1" data-ps="'+p.id+'" value="'+p.stock+'" aria-label="'+esc(w.stockL)+'"></label>'+
      '<label class="pshow"><input type="checkbox" data-ph="'+p.id+'"'+(p.hidden?'':' checked')+'> '+esc(w.showL)+'</label></div>'}).join('')+'</div>';
}
function adMessages(){
  var w=W(),list=S.db.msgs.slice().sort(function(a,b){return b.at-a.at});
  if(!list.length)return '<p class="muted" style="margin-top:10px">'+esc(w.msgsNone)+'</p>';
  return '<div class="olist" style="margin-top:6px">'+list.map(function(m){
    return '<div class="msg'+(m.done?' done':'')+'"><b>'+esc(L(m.name))+'</b> · <span class="ometa">'+esc(m.phone)+' · '+esc(dtL(m.at))+'</span>'+(m.sample?' <span class="pill sample">'+esc(w.sample)+'</span>':'')+
      (m.item&&P(m.item)?'<div class="ometa">'+esc(w.cAbout(iname(P(m.item))))+'</div>':'')+'<p>'+esc(L(m.text))+'</p>'+
      '<div class="btnrow"><a class="btn wa sm" target="_blank" rel="noopener" href="'+wa(w.replyText(shop()))+'">'+esc(w.reply)+'</a>'+(m.done?'<span class="pill delivered">'+esc(w.doneL)+'</span>':'<button class="btn ghost sm" type="button" data-act="msgdone" data-id="'+m.id+'">'+esc(w.markDone)+'</button>')+'</div></div>'}).join('')+'</div>';
}
function adSettings(){
  var w=W(),s=S.db.settings;
  function numF(k,label){return '<div class="field"><label for="s_'+k+'">'+esc(label)+'</label><input id="s_'+k+'" type="number" min="0" step="10" data-set="'+k+'" value="'+(+s[k])+'"></div>'}
  return '<div class="cards2" style="margin-top:6px"><div class="acard"><h3>'+esc(w.setDelivery)+'</h3>'+numF('feeIn',w.setFeeIn)+(K().outside?numF('feeOut',w.setFeeOut):'')+numF('freeOver',w.setFree)+'</div>'+
    '<div class="acard"><h3>'+esc(w.setPays)+'</h3>'+['cod','bkash','nagad','card'].map(function(k){return '<label class="chk"><input type="checkbox" data-setb="'+k+'"'+(s[k]?' checked':'')+'> '+esc(w.pm[k])+'</label>'}).join('')+
    '<h3 style="margin-top:16px">'+esc(w.setShop)+'</h3><label class="chk"><input type="checkbox" data-setb="open"'+(s.open?' checked':'')+'> '+esc(w.setOpen)+'</label>'+
    '<button class="btn ghost sm" type="button" data-act="reset" style="margin-top:18px">'+esc(S.resetArm?w.resetSure:w.reset)+'</button></div></div>';
}

/* ---------- invoice ---------- */
function printInvoice(o){
  var w=W();
  $('print').innerHTML='<div class="inv"><h1>'+esc(shop())+'</h1><p>'+esc(w.orderL)+' #'+dig(o.id)+' · '+esc(dtL(o.at))+'</p>'+
    '<p><b>'+esc(L(o.name))+'</b><br>'+esc(o.phone)+'<br>'+esc(L(o.addr))+', '+esc(L(area(o.area)))+'</p>'+
    '<table><tr><th>'+esc(w.itemsL)+'</th><th>'+esc(w.total)+'</th></tr>'+o.lines.map(function(l){var p=P(l.id)||{en:l.id,bn:l.id};return '<tr><td>'+esc(iname(p))+(l.opt?' ('+esc(optLabel(l.id,l.opt))+')':'')+' × '+num(l.q)+'</td><td>'+tk(l.p*l.q)+'</td></tr>'}).join('')+
    (o.disc?'<tr><td>'+esc(w.disc)+'</td><td>−'+tk(o.disc)+'</td></tr>':'')+'<tr><td>'+esc(w.fee)+'</td><td>'+(o.fee?tk(o.fee):esc(w.free))+'</td></tr><tr><th>'+esc(w.total)+'</th><th>'+tk(o.total)+'</th></tr></table>'+
    '<p>'+esc(payLine(o))+'</p><p style="font-size:12px;color:#555">'+esc(w.demoNote)+'</p></div>';
  try{window.print()}catch(e){}
}

/* ---------- render ---------- */
function render(scroll){
  var r=route(),pg=r[0]||'',html;
  applyTheme();renderBar();renderTop();renderFoot();
  if(pg!=='admin')renderModal(null);
  var premOnly=['cart','checkout','pay','order','track','admin'];
  if(!premium()&&premOnly.indexOf(pg)>=0)html=pagePremOnly();
  else switch(pg){
    case '':html=pageHome();break;
    case 'shop':html=pageShop(r[1]);break;
    case 'p':html=pageProduct(r[1]);break;
    case 'cart':html=pageCart();break;
    case 'checkout':html=pageCheckout();break;
    case 'pay':html=pagePay(r[1]);break;
    case 'order':html=pageOrder(r[1]);break;
    case 'track':html=pageTrack(r[1]);break;
    case 'about':html=pageAbout();break;
    case 'contact':html=pageContact(r[1]);break;
    case 'admin':html=pageAdmin(r[1],r[2]);break;
    default:html=pageNF(W().notFound);
  }
  $('app').innerHTML=html;
  if(scroll)window.scrollTo(0,0);
}
function rerender(){var y=window.scrollY;render(false);window.scrollTo(0,y)}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var act=t.getAttribute('data-act'),id=t.getAttribute('data-id'),w=W();
  if(act==='closemodal'){if(e.target!==t)return;e.preventDefault();go('admin/orders');return}
  switch(act){
    case 'plan':S.plan=t.getAttribute('data-v');setParam('plan',S.plan==='business'?'business':null);rerender();break;
    case 'lang':S.lang=t.getAttribute('data-v');try{localStorage.setItem('nobo-store-lang',S.lang)}catch(er){}setParam('lang',null);rerender();break;
    case 'add':addCart(id,'',1);break;
    case 'opt':S.pp.opt=t.getAttribute('data-v');rerender();break;
    case 'ppinc':S.pp.q=Math.min(20,S.pp.q+1);rerender();break;
    case 'ppdec':S.pp.q=Math.max(1,S.pp.q-1);rerender();break;
    case 'ppadd':{
      var o=(OPTS[S.kind]||{})[S.pp.id],opt='';
      if(o&&o.t!=='text'){if(!S.pp.opt){toast(w.needOpt);return}opt=S.pp.opt}
      if(o&&o.t==='text'){var ti=$('ptext');opt=(ti?ti.value:'').trim().slice(0,40);S.pp.text=''}
      if(addCart(S.pp.id,opt,S.pp.q)){S.pp.q=1;rerender()}
      break;}
    case 'cinc':case 'cdec':{
      var l=S.db.cart[+t.getAttribute('data-i')];if(!l)return;var p=P(l.id);
      if(act==='cinc'){if(inCart(l.id)>=p.stock){toast(w.maxStock(p.stock));return}l.q++}else{l.q--;if(l.q<1)S.db.cart.splice(S.db.cart.indexOf(l),1)}
      saveDB();rerender();break;}
    case 'crm':S.db.cart.splice(+t.getAttribute('data-i'),1);saveDB();rerender();break;
    case 'clearq':S.q='';var qi=$('q');if(qi)qi.value='';var g2=$('shopGrid');if(g2)g2.innerHTML=shopGrid(route()[1]);break;
    case 'payok':{var o2=findOrder(id);if(!o2)return;var now=Date.now();o2.paid=true;o2.trx='DEMO'+rid(8);o2.status='confirmed';o2.hist={placed:now,confirmed:now};S.payFail=null;saveDB();go('order/'+o2.id);setTimeout(function(){toast(w.seeDash,'#/admin/orders/'+o2.id,w.dash+' ›')},400);break;}
    case 'payfail':S.payFail=+id;rerender();break;
    case 'paycod':{var o3=findOrder(id);if(!o3)return;o3.pay='cod';o3.status='placed';o3.hist={placed:Date.now()};S.payFail=null;saveDB();go('order/'+o3.id);break;}
    case 'print':{var o4=findOrder(id);if(o4)printInvoice(o4);break;}
    case 'confirm':setStatus(findOrder(id),'confirmed');rerender();break;
    case 'of':e.preventDefault();OF=t.getAttribute('data-v');rerender();break;
    case 'courier':{var o5=findOrder(id);if(!o5)return;o5.courier='DC'+Math.floor(100000+Math.random()*899999);setStatus(o5,'shipped');toast(w.courierBooked(o5.courier));rerender();break;}
    case 'msgdone':S.db.msgs.forEach(function(m){if(String(m.id)===id)m.done=true});saveDB();rerender();break;
    case 'reset':
      if(!S.resetArm){S.resetArm=true;rerender();setTimeout(function(){S.resetArm=false},4000);return}
      S.resetArm=false;S.db=freshDB();saveDB();OF='all';toast(w.resetDone);go('admin');break;
  }
});
document.addEventListener('submit',function(e){
  var f=e.target,kind=f.getAttribute('data-form');if(!kind)return;e.preventDefault();var w=W();
  if(kind==='coupon'){var c=($('coupon').value||'').trim().toUpperCase();if(c==='NEW10'){S.db.coupon='NEW10';saveDB();toast(w.couponOk)}else{S.db.coupon='';saveDB();toast(c?w.couponBad:w.couponHint)}rerender()}
  if(kind==='checkout'){readCheckout(f);S.errs=validate();if(Object.keys(S.errs).length){rerender();var first=document.querySelector('.field.bad input,.field.bad select,.field.bad textarea');if(first){first.focus();first.scrollIntoView({block:'center'})}return}placeOrder()}
  if(kind==='track'){var fd=new FormData(f);S.found={id:toLatin(String(fd.get('id')||'')).replace(/\D/g,''),phone:normPhone(String(fd.get('phone')||''))};rerender()}
  if(kind==='contact'){
    var fd2=new FormData(f),nm=String(fd2.get('name')||'').trim(),ph=normPhone(String(fd2.get('phone')||'')),msg=String(fd2.get('msg')||'').trim();
    S.cErr={};if(!nm)S.cErr.name=w.eName;if(!ph)S.cErr.phone=w.ePhone;if(msg.length<3)S.cErr.msg=w.eMsg;
    if(Object.keys(S.cErr).length){rerender();var v=document.querySelector('[data-form=contact]');if(v){v.name.value=nm;v.phone.value=String(fd2.get('phone')||'');v.msg.value=msg}return}
    if(premium()){S.db.msgs.push({id:Date.now(),sample:false,at:Date.now(),name:nm,phone:ph,text:msg,item:String(fd2.get('item')||''),done:false});saveDB()}
    f.reset();toast(premium()?w.sent:w.sentBiz);rerender();
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){S.q=t.value;var g=$('shopGrid');if(g)g.innerHTML=shopGrid(route()[1]);return}
  if(t.closest&&t.closest('[data-form=checkout]')&&S.form&&t.name&&t.type!=='radio'){S.form[t.name]=t.value;if(S.errs[t.name]){delete S.errs[t.name];var fl=t.closest('.field');if(fl){fl.classList.remove('bad');var er=fl.querySelector('.err');if(er)er.remove()}}}
});
document.addEventListener('change',function(e){
  var t=e.target,w=W();
  if(t.id==='sort'){S.sort=t.value;rerender();return}
  if(t.closest&&t.closest('[data-form=checkout]')&&S.form&&t.name){S.form[t.name]=t.value;if(t.name==='area'||t.name==='pay'){var a=$('coSum');if(a)a.innerHTML=coSum()}return}
  var sid=t.getAttribute('data-st');if(sid){setStatus(findOrder(sid),t.value);rerender();return}
  var pp=t.getAttribute('data-pp');if(pp){S.db.products[pp].p=Math.max(0,Math.round(+t.value||0));saveDB();toast(w.saved);return}
  var ps=t.getAttribute('data-ps');if(ps){S.db.products[ps].stock=Math.max(0,Math.round(+t.value||0));saveDB();toast(w.saved);rerender();return}
  var ph=t.getAttribute('data-ph');if(ph){S.db.products[ph].hidden=!t.checked;saveDB();toast(w.saved);return}
  var sk=t.getAttribute('data-set');if(sk){S.db.settings[sk]=Math.max(0,Math.round(+t.value||0));saveDB();toast(w.saved);return}
  var sb=t.getAttribute('data-setb');if(sb){
    S.db.settings[sb]=t.checked;
    if(sb!=='open'&&!['cod','bkash','nagad','card'].some(function(k){return S.db.settings[k]})){S.db.settings[sb]=true;t.checked=true;toast(w.oneMethod);return}
    saveDB();toast(w.saved);renderTop();return}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('modal').innerHTML&&route()[0]==='admin'){go('admin/orders')}});
window.addEventListener('hashchange',function(){S.found=route()[0]==='track'?S.found:null;S.cErr={};render(true)});

/* ---------- start ---------- */
parseLink();
loadDB();
if(!location.hash)history.replaceState(null,'',location.pathname+location.search+'#/');
render(false);
})();
</script>
</body>
</html>
