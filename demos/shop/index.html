<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Website Demo · Nobo Ishraque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: dark demo bar, then either a phone-first shop site (view: site) or a chat phone + owner panel (view: inbox). Accent tokens are swapped per shop type by script. */
  --ink:#2a1f26; --muted:#6b5d66; --paper:#fffafa; --card:#ffffff; --line:#e8e0e4;
  --accent:#b0245a; --accent-ink:#ffffff; --accent-soft:#fbe4ed; --tile:#fde6ee; --tile2:#fff0d6;
  --bar:#1c1820; --wa:#1b9e50; --ok:#17603f;
  --f-display:"Baloo Da 2","Hind Siliguri",system-ui,sans-serif;
  --f-body:"Hind Siliguri","Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
h1,h2,h3{text-wrap:balance}
.hide{display:none!important}

/* demo bar */
.demobar{position:sticky;top:0;z-index:30;background:var(--bar);color:#f4eef1;font-size:14px}
.demobar .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-top:8px;padding-bottom:8px}
.db-text{display:flex;align-items:center;gap:8px;min-width:0;font-weight:500}
.db-pill{flex:none;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:11px;letter-spacing:.08em;padding:2px 9px;border-radius:99px}
.db-controls{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:#ffffff1a;border-radius:99px;padding:3px}
.seg button{border:0;background:transparent;color:#f4eef1;opacity:.75;padding:5px 12px;border-radius:99px;cursor:pointer;font-size:14px;font-weight:600}
.seg button[aria-pressed="true"]{background:#fff;color:var(--bar);opacity:1}
.db-note{background:#2a2430;color:#e9e1e6;font-size:13px}
.db-note .wrap{padding-top:5px;padding-bottom:6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:10px 18px;font-weight:600;font-size:16px;border:1px solid transparent;cursor:pointer;text-decoration:none;line-height:1.2}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.wa{background:var(--wa);color:#fff}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn[aria-disabled="true"]{opacity:.55}

/* site: hero */
.hero{background:linear-gradient(180deg,var(--accent-soft),var(--paper));padding:28px 0 18px}
.hero-in{display:flex;gap:16px;align-items:flex-start}
.logo{flex:none;width:64px;height:64px;border-radius:20px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:26px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,42px);line-height:1.1;margin:2px 0 0}
.tag{margin:6px 0 12px;color:var(--muted);font-size:17px;max-width:52ch}
.chips{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chips li{background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:14px;font-weight:500}
.hero-cta{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:480px){.logo{width:52px;height:52px;border-radius:16px;font-size:21px}}

/* site: catalog */
.sec{padding:22px 0}
.sec h2{font-family:var(--f-display);font-weight:700;font-size:25px;line-height:1.2;margin:0 0 12px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 15px;font-weight:600;cursor:pointer}
.cats button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:4/3;display:grid;place-items:center;font-size:54px;line-height:1;background:radial-gradient(circle at 35% 30%,#ffffff 0 16%,var(--t,var(--tile)) 72%)}
.pbody{padding:11px 13px 13px;display:flex;flex-direction:column;gap:2px;flex:1}
.pname{font-family:var(--f-display);font-weight:700;font-size:17.5px;line-height:1.25;margin:0}
.punit{color:var(--muted);font-size:13px}
.pdesc{font-size:14px;color:var(--muted);margin:2px 0 0;line-height:1.45}
.price{margin-top:auto;padding-top:8px;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.add{margin-top:8px;width:100%;border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 10px;font-weight:600;cursor:pointer}
.qty{margin-top:8px;display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--accent);border-radius:10px;overflow:hidden}
.qty button{border:0;background:var(--accent-soft);color:var(--accent);width:40px;height:36px;font-size:20px;font-weight:700;cursor:pointer}
.qty span{font-weight:700;font-variant-numeric:tabular-nums}

/* site: info */
.steps{list-style:none;padding:0;margin:0;display:grid;gap:10px;counter-reset:s}
@media(min-width:700px){.steps{grid-template-columns:repeat(3,1fr)}}
.steps li{counter-increment:s;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 54px;position:relative;font-weight:500}
.steps li::before{content:counter(s);position:absolute;left:14px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:15px}
.two{display:grid;gap:12px}
@media(min-width:700px){.two{grid-template-columns:1fr 1fr}}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.box h3{margin:0 0 4px;font-size:17px}
.box p{margin:0;color:var(--muted)}
details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details+details{margin-top:8px}
summary{cursor:pointer;font-weight:600}
details p{margin:6px 0 2px;color:var(--muted)}
.credit{background:var(--bar);color:#f4eef1;border-radius:18px;padding:18px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.credit b{display:block;font-size:17px}
.credit p{margin:2px 0 0;color:#e2d8de;font-size:14.5px;max-width:60ch}
.credit-actions{display:flex;gap:8px;flex-wrap:wrap}
.credit .btn.ghost{background:transparent;border-color:#ffffff59;color:#fff}
.foot{padding:4px 0 110px}

/* cart bar + sheet */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 16px 14px;display:none;pointer-events:none}
.cartbar.show{display:block}
.cartbar button{pointer-events:auto;width:100%;max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--ink);color:#fff;border:0;border-radius:16px;padding:14px 18px;font-weight:700;font-size:16px;box-shadow:0 10px 28px #0000003d;cursor:pointer}
.cartbar .go{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:5px 12px}
.sheet{position:fixed;inset:0;z-index:40;display:none;background:#1c18208c;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet-in{background:var(--paper);width:100%;max-width:560px;max-height:calc(100% - 20px);overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px 22px}
@media(min-width:700px){.sheet{align-items:center}.sheet-in{border-radius:20px;max-height:calc(100% - 48px)}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.sheet-head h2{font-family:var(--f-display);font-size:24px;margin:0}
.lines{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:8px}
.lines li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.lines .nm{font-weight:600;line-height:1.3}
.lines .nm small{display:block;font-weight:400;color:var(--muted)}
.lines .qty{margin:0;width:112px}
.lines .qty button{width:34px;height:32px;font-size:18px}
.lines .lt{font-weight:700;font-variant-numeric:tabular-nums;min-width:68px;text-align:right}
.form{display:grid;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.row2{grid-template-columns:1fr}}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:3px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff}
.field textarea{min-height:64px;resize:vertical}
.err{color:#b42318;font-size:13px;margin-top:3px}
.radio{display:flex;gap:8px;flex-wrap:wrap}
.radio label{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-weight:500;font-size:15px;cursor:pointer}
.totals{margin:14px 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.totals div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.totals .grand{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px;font-weight:700;font-size:18px}
.small{font-size:13.5px;color:var(--muted)}
.preview{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;max-height:200px;overflow:auto;margin:4px 0 12px;font-family:var(--f-body)}
.actions{display:grid;gap:8px}

/* inbox */
.inbox{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:24px;padding-top:22px;padding-bottom:40px;align-items:start}
@media(max-width:899px){.inbox{grid-template-columns:minmax(0,1fr)}}
.phone-tools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 auto 10px;max-width:380px;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.phone{background:#fff;border:10px solid var(--bar);border-radius:34px;height:640px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 40px #1c182026;max-width:380px;margin:0 auto}
@media(max-width:899px){.phone{height:570px}}
.ph-status{display:flex;justify-content:space-between;padding:5px 18px 1px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.ph-head{display:flex;align-items:center;gap:10px;padding:6px 14px 10px;border-bottom:1px solid var(--line)}
.logo.sm{width:38px;height:38px;border-radius:50%;font-size:15px}
.ph-head b{display:block;font-size:15px;line-height:1.2}
.ph-head small{color:var(--ok);font-size:12px;font-weight:500}
.ph-head small.off{color:#8a5a00}
.ph-body{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;background:#faf8f9}
.msg{max-width:84%;padding:8px 12px;border-radius:18px;font-size:14.5px;line-height:1.45;white-space:pre-line;overflow-wrap:anywhere}
.msg.bot{align-self:flex-start;background:#eeeaed;border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.typing{align-self:flex-start;background:#eeeaed;border-radius:18px;padding:11px 14px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:#9a8f95;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}}
.ph-quick{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-top:1px solid var(--line);background:#fff;max-height:128px;overflow-y:auto}
.ph-quick:empty{display:none}
.ph-quick button{border:1.5px solid var(--accent);color:var(--accent);background:#fff;border-radius:99px;padding:4px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.ph-input{display:flex;gap:8px;padding:8px 10px 12px;border-top:1px solid var(--line);background:#fff}
.ph-input input{flex:1;min-width:0;border:1px solid var(--line);border-radius:99px;padding:8px 14px;background:#f6f3f5}
.ph-input button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:8px 14px;font-weight:600;cursor:pointer}
.hint{font-size:13.5px;color:var(--muted);text-align:center;margin:10px auto 0;max-width:380px}
.owner{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.panel h2{font-family:var(--f-display);font-size:21px;line-height:1.2;margin:0 0 2px}
.panel .sub{margin:0 0 12px;color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:600px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font-size:12.5px;color:var(--muted);font-weight:600;background:#faf8f9}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.fresh td{background:#e8f6ee}
.pill{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12.5px;font-weight:600}
.pill.new{background:#dff3e8;color:#17603f}.pill.packing{background:#fff1d1;color:#7a5200}.pill.done{background:#eceaf0;color:#514a57}
.rules{display:flex;flex-direction:column;gap:12px}
.rule label{font-weight:600;font-size:14.5px}
.rule .trig{font-size:12.5px;color:var(--muted);margin:1px 0 5px}
.rule textarea{width:100%;min-height:62px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;resize:vertical;background:#fdfcfd}
.honest{font-size:13.5px;color:var(--muted);margin:0}
.cta{background:var(--bar);color:#f4eef1;border-radius:16px;padding:16px}
.cta b{display:block;font-size:17px}
.cta p{margin:2px 0 10px;color:#e2d8de;font-size:14.5px}
</style>
</head>
<body>
<div class="demobar">
  <div class="wrap">
    <div class="db-text"><span class="db-pill" id="dbPill">DEMO</span><span id="dbText"></span></div>
    <div class="db-controls">
      <div class="seg" role="group" aria-label="View">
        <button type="button" id="tabSite" aria-pressed="true"></button>
        <button type="button" id="tabInbox" aria-pressed="false"></button>
      </div>
      <div class="seg" role="group" aria-label="Language">
        <button type="button" id="lnBn" aria-pressed="true">বাংলা</button>
        <button type="button" id="lnEn" aria-pressed="false">EN</button>
      </div>
    </div>
  </div>
</div>
<div class="db-note"><div class="wrap" id="dbNote"></div></div>

<main>
  <div id="viewSite"></div>
  <div id="viewInbox" class="hide"></div>
</main>

<div class="cartbar" id="cartbar"><button type="button" id="cartBtn"></button></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-in" id="sheetIn"></div></div>

<script>

/* ---------- link handling: #[inbox-]<kind>[-shop-name] ---------- */
function slugToName(s){return s.replace(/--/g,"'").split('-').filter(Boolean).map(function(w){return w==='bd'?'BD':w.charAt(0).toUpperCase()+w.slice(1)}).join(' ')}
function parseLink(){
  var q={};
  try{new URLSearchParams(location.search).forEach(function(v,k){q[k.toLowerCase()]=v})}catch(e){}
  var h=(location.hash||'').slice(1).toLowerCase(),view='site',kind='bakery',name=null,nameBn=null,pitch=false;
  try{h=decodeURIComponent(h)}catch(e){}
  if(/^inbox(-|$)/.test(h)){view='inbox';h=h.replace(/^inbox-?/,'')}
  /* older links kept everything in the hash: #[inbox-]<type>[-shop-name] */
  var m=h.match(/^(bakery|fashion|food|beauty|gifts)(?:-(.*))?$/);
  if(m){kind=m[1];var sl=(m[2]||'').replace(/[^a-z0-9-]/g,'');if(sl){name=slugToName(sl);pitch=true}}
  var t=(q.type||'').toLowerCase();if(KINDS[t])kind=t;
  if(q['for']){name=q['for'].slice(0,60);pitch=true}
  else if(q.shop){name=q.shop.slice(0,60)}
  if(q.bn){nameBn=q.bn.slice(0,60);if(!name)pitch=!!q['for']}
  if(name&&/[ঀ-৿]/.test(name)&&!/[A-Za-z]/.test(name)){nameBn=nameBn||name}
  return {view:view,kind:kind,name:name,nameBn:nameBn,pitch:pitch};
}
function writeHash(){
  try{history.replaceState(null,'',location.pathname+location.search+(S.view==='inbox'?'#inbox':''))}catch(e){}
}

function has(s,w){
  if(/^[a-z]+$/.test(w)&&w.length<=4)return new RegExp('(^|[^a-z])'+w+'([^a-z]|$)').test(s);
  return s.indexOf(w)>-1;
}
function detect(text){
  var s=' '+text.toLowerCase()+' ',best=null,top=0;
  INTENT_ORDER.forEach(function(k){
    var sc=0;INTENTS[k].forEach(function(w){if(has(s,w))sc+=WEAK.indexOf(w)>-1?1:2});
    if(sc>top){top=sc;best=k}
  });
  return best;
}
function findItems(text){
  var s=text.toLowerCase().replace(/[?!.,।:;"'()]/g,' '),toks=s.split(/\s+/).filter(Boolean),res=[];
  K().items.forEach(function(it){
    var words=(it.en+' '+it.bn).toLowerCase().replace(/[’'()]/g,' ').split(/[\s,-]+/).filter(function(w){return w.length>=3&&STOP.indexOf(w)<0});
    var sc=0;
    words.forEach(function(w){
      if(toks.indexOf(w)>-1||toks.some(function(x){return x.length>=4&&(w.indexOf(x)===0||x.indexOf(w)===0)}))sc+=2;
      else if(s.indexOf(w)>-1)sc+=1;
    });
    if(sc)res.push({it:it,sc:sc});
  });
  if(!res.length)return [];
  var max=Math.max.apply(null,res.map(function(r){return r.sc}));
  return res.filter(function(r){return r.sc===max}).map(function(r){return r.it});
}
function priceText(){
  var w=W();
  return w.priceHead+'\n'+K().items.slice(0,7).map(function(it){return '• '+iname(it)+' ('+iunit(it)+'): '+tk(it.p)}).join('\n')+'\n'+w.priceTail;
}
function answer(intent){
  var w=W();
  if(intent==='price')return botSay(priceText());
  if(intent==='delivery'||intent==='payment'||intent==='time')return botSay(rule(intent));
  if(intent==='order')return startFlow(null);
  if(intent==='human')return botSay(w.human(S.away));
  if(intent==='greet')return botSay(rule(S.away?'away':'greet'));
  botSay(w.fallback);
}
function customer(text,qid){
  S.chat.push({from:'me',text:text});S.quick=[];drawChat();
  if(S.flow)return flowStep(text,qid);
  if(qid&&qid.indexOf('q:')===0)return answer(qid.slice(2));
  if(qid&&qid.indexOf('orderitem:')===0)return startFlow(itemById(qid.slice(10)));
  var intent=detect(text);
  if(!intent||intent==='price'||intent==='greet'){
    var f=findItems(text);
    if(f.length===1){var it=f[0],w=W();return botSay(w.itemReply(iname(it),iunit(it),tk(it.p),idesc(it)),[{id:'orderitem:'+it.id,label:w.q.order}].concat(mainQuick().filter(function(q){return q.id!=='q:order'})))}
    if(f.length>1)return botSay(W().multi+'\n'+f.map(function(it){return '• '+iname(it)+' ('+iunit(it)+'): '+tk(it.p)}).join('\n'));
  }
  answer(intent);
}
function itemQuick(){return K().items.slice(0,8).map(function(it){return {id:'item:'+it.id,label:iname(it)}})}
function qtyQuick(){return [1,2,3,4,5].map(function(n){return {id:'qty:'+n,label:num(n)}})}
function areaQuick(){return CHAT_AREAS.filter(function(id){return !area(id).out||K().outside}).map(function(id){return {id:'area:'+id,label:areaName(id)}})}
function startFlow(it){
  S.flow={step:'product'};
  if(it){S.flow.item=it.id;S.flow.step='qty';return botSay(W().askQty(iname(it)),qtyQuick())}
  botSay(W().askProduct,itemQuick());
}
function cancelFlow(){S.flow=null;botSay(W().cancelled)}
function flowStep(text,qid){
  var w=W(),f=S.flow,low=text.toLowerCase();
  if(qid==='no'||/বাতিল|cancel|^no$|না থাক/.test(low))return cancelFlow();
  if(qid&&qid.indexOf('q:')===0){S.flow=null;return answer(qid.slice(2))}
  if(f.step==='product'){
    var it=qid&&qid.indexOf('item:')===0?itemById(qid.slice(5)):(function(){var r=findItems(text);return r.length===1?r[0]:null})();
    if(!it)return botSay(w.pick,itemQuick());
    f.item=it.id;f.step='qty';return botSay(w.askQty(iname(it)),qtyQuick());
  }
  if(f.step==='qty'){
    var m=toLatin(qid&&qid.indexOf('qty:')===0?qid.slice(4):text).match(/\d+/),n=m?parseInt(m[0],10):0;
    if(!(n>=1&&n<=20))return botSay(w.badQty,qtyQuick());
    f.qty=n;f.step='area';return botSay(w.askArea,areaQuick());
  }
  if(f.step==='area'){
    var a=null;
    if(qid&&qid.indexOf('area:')===0)a=area(qid.slice(5));
    else AREAS.forEach(function(x){if(!a&&(low.indexOf(x.en.toLowerCase())>-1||text.indexOf(x.bn)>-1))a=x});
    if(!a)return botSay(w.pick,areaQuick());
    if(a.out&&!K().outside)return botSay(w.outNo,areaQuick());
    f.area=a.id;f.step='addr';return botSay(w.askAddr,[{id:'no',label:w.no}]);
  }
  if(f.step==='addr'){
    if(text.trim().length<6)return botSay(w.badAddr,[{id:'no',label:w.no}]);
    f.addr=text.trim();f.step='phone';return botSay(w.askPhone,[{id:'no',label:w.no}]);
  }
  if(f.step==='phone'){
    var p=normPhone(text);if(!p)return botSay(w.badPhone,[{id:'no',label:w.no}]);
    f.phone=p;f.step='confirm';
    var it2=itemById(f.item),fee=feeOf(f.area);
    return botSay(w.summary({item:iname(it2),qty:num(f.qty),area:areaName(f.area),addr:f.addr,phone:p,fee:tk(fee),total:tk(it2.p*f.qty+fee)}),[{id:'yes',label:w.yes},{id:'no',label:w.no}]);
  }
  if(f.step==='confirm'){
    if(qid==='yes'||/হ্যাঁ|হা|^ha$|^yes|^ok|কনফার্ম|confirm|ঠিক আছে/.test(low)){
      var it3=itemById(f.item),total=it3.p*f.qty+feeOf(f.area),d=new Date(),id=S.nextId++;
      S.orders.forEach(function(o){o.fresh=false});
      S.orders.push({id:id,t:pad(d.getHours())+':'+pad(d.getMinutes()),item:f.item,qty:f.qty,area:f.area,phone:mask(f.phone),status:'new',fresh:true});
      S.flow=null;drawSheet();drawStats();
      return botSay(w.done(id,tk(total)));
    }
    return botSay(w.pick,[{id:'yes',label:w.yes},{id:'no',label:w.no}]);
  }
}

/* ---------- wiring ---------- */
function resetForKind(){S.cart={};S.cat='all';S.form=null;S.tried=false;S.orders=seedOrders();S.nextId=1043;S.replies=0}
function renderAll(){applyTheme();renderBar();renderSite();renderInbox();startChat();showView();if($('sheet').classList.contains('open'))openSheet()}
function applyHash(){
  var p=parseLink(),changed=p.kind!==S.kind||p.name!==S.name||p.nameBn!==S.nameBn;
  S.kind=p.kind;S.name=p.name;S.nameBn=p.nameBn;S.pitch=p.pitch;S.view=p.view;
  if(changed){resetForKind();closeSheet()}
  if(changed||!S.ready){S.ready=true;renderAll()}else showView();
}
document.addEventListener('click',function(e){
  var t=e.target.closest('button,a');if(!t)return;
  if(t.dataset.inc){changeQty(t.dataset.inc,1);return}
  if(t.dataset.dec){changeQty(t.dataset.dec,-1);return}
  if(t.dataset.cat){S.cat=t.dataset.cat;document.querySelectorAll('[data-cat]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.cat===S.cat)});renderGrid();return}
  if(t.dataset.q){customer(t.textContent,t.dataset.q);return}
  switch(t.id){
    case 'goItems':var s=$('itemsSec');if(s)s.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});break;
    case 'cartBtn':openSheet();break;
    case 'closeSheet':closeSheet();break;
    case 'tabSite':case 'tabInbox':S.view=t.id==='tabSite'?'site':'inbox';writeHash();showView();window.scrollTo(0,0);break;
    case 'lnBn':case 'lnEn':var l=t.id==='lnBn'?'bn':'en';if(l!==S.lang){S.lang=l;save('qb-demo-lang',l);renderAll()}break;
    case 'resetChat':startChat();break;
    case 'waBtn':readForm();S.tried=true;updateSheet();if(t.getAttribute('aria-disabled')==='true')e.preventDefault();break;
    case 'copyBtn':
      var txt=orderText(),w=W();
      var done=function(){t.textContent=w.copied;setTimeout(function(){t.textContent=w.copy},1600)};
      try{navigator.clipboard.writeText(txt).then(done,function(){selectPreview();done()})}catch(err){selectPreview();done()}
      break;
  }
});
function selectPreview(){try{var r=document.createRange();r.selectNodeContents($('sPreview'));var s=getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}}
document.addEventListener('input',function(e){
  if(e.target.closest&&e.target.closest('#oForm'))updateSheet();
  if(e.target.dataset&&e.target.dataset.rule){S.edits[S.kind+'|'+S.lang+'|'+e.target.dataset.rule]=e.target.value}
});
document.addEventListener('change',function(e){
  if(e.target.closest&&e.target.closest('#oForm'))updateSheet();
  if(e.target.id==='awayT'){S.away=e.target.checked;startChat()}
});
document.addEventListener('submit',function(e){
  if(e.target.id==='chatForm'){e.preventDefault();var i=$('chatIn'),v=i.value.trim();if(v){i.value='';customer(v,null)}}
  if(e.target.id==='oForm')e.preventDefault();
});
$('sheet').addEventListener('click',function(e){if(e.target.id==='sheet')closeSheet()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('sheet').classList.contains('open'))closeSheet()});
window.addEventListener('hashchange',applyHash);
setInterval(function(){if(!S.away)drawPhoneState()},30000);

var saved=read('qb-demo-lang');if(saved==='en'||saved==='bn')S.lang=saved;
S.orders=seedOrders();
applyHash();
})();
</script>
